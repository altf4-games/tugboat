# Traefik's bundled Docker client hardcodes API version 1.24 and never
# negotiates upward, but some daemons (e.g. OrbStack) reject any request
# below their minimum supported version outright. This proxy strips a
# versioned "/vX.Y/" prefix from the request path before forwarding to the
# real socket, so the daemon falls back to its default (latest) API
# version regardless of what the client thinks it's speaking.
user root;
events {}
http {
  upstream docker_upstream {
    server unix:/var/run/docker.sock;
  }
  server {
    listen 2375;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The Docker /events endpoint is a long-lived streaming response (used
    # by Traefik for real-time container start/stop notifications); nginx's
    # default response buffering would hold it back until the buffer fills,
    # so real-time updates must not be buffered.
    proxy_buffering off;

    location ~ ^/v[0-9]+\.[0-9]+/(.*)$ {
      proxy_pass http://docker_upstream/$1$is_args$args;
    }

    location / {
      proxy_pass http://docker_upstream;
    }
  }
}
