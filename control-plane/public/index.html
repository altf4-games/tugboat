<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tugboat</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #111111;
    --border: #262626;
    --text: #ededed;
    --text-dim: #888888;
    --accent: #ffffff;
    --success: #2fd058;
    --error: #f2495c;
    --building: #f5a623;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .user { display: flex; align-items: center; gap: 10px; }
  .user img { width: 28px; height: 28px; border-radius: 50%; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    padding: 8px 14px;
  }
  button:hover { border-color: #444; }
  button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { opacity: 0.85; }
  button.danger { color: var(--error); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  .hero { text-align: center; padding: 96px 24px; }
  .hero h1 { font-size: 32px; margin-bottom: 8px; }
  .hero p { color: var(--text-dim); margin-bottom: 32px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .row h2 { margin: 0; font-size: 20px; }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .project-card { cursor: pointer; transition: border-color .15s; }
  .project-card:hover { border-color: #444; }
  .project-head { display: flex; align-items: center; justify-content: space-between; }
  .project-repo { font-weight: 600; font-size: 15px; }
  .project-meta { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 3px 8px;
    border-radius: 100px;
  }
  .badge.success { background: rgba(47,208,88,.12); color: var(--success); }
  .badge.failed { background: rgba(242,73,92,.12); color: var(--error); }
  .badge.building { background: rgba(245,166,35,.12); color: var(--building); }
  .badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.building .pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .deploy-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; display: none; }
  .deploy-list.open { display: block; }
  .deploy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
  }
  .deploy-row:last-child { border-bottom: none; }
  .deploy-left { display: flex; align-items: center; gap: 10px; }
  .sha { color: var(--text-dim); }
  a.link { color: #6ea8ff; text-decoration: none; font-family: var(--font-mono); font-size: 12px; }
  a.link:hover { text-decoration: underline; }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 0; }
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    align-items: flex-start;
    justify-content: center;
    padding-top: 8vh;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 480px;
    max-width: 90vw;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font: inherit;
    margin: 14px 18px 0;
    width: calc(100% - 36px);
  }
  .repo-list { overflow-y: auto; padding: 8px 8px 14px; }
  .repo-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .repo-item:hover { background: #1a1a1a; }
  .repo-item .name { font-family: var(--font-mono); font-size: 13px; }
  .close-x { background: none; border: none; color: var(--text-dim); font-size: 18px; padding: 0; }
  pre.log {
    background: #000;
    color: #d6d6d6;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 14px;
    border-radius: 8px;
    max-height: 380px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 10px;
  }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> Tugboat</div>
  <div class="user" id="userBox"></div>
</header>

<main id="app"></main>

<div class="modal-backdrop" id="linkModal">
  <div class="modal">
    <div class="modal-head">
      <strong>Link a GitHub repo</strong>
      <button class="close-x" onclick="closeLinkModal()">✕</button>
    </div>
    <input type="text" id="repoSearch" placeholder="Search your repos..." oninput="renderRepoList()" />
    <div class="repo-list" id="repoList"></div>
  </div>
</div>

<script>
let me = null;
let repos = [];
let projects = [];
let deploymentsByRepo = {};
let openStreams = {};

async function api(path, opts) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts && opts.headers) } });
  if (res.status === 401) { render(); throw new Error("not signed in"); }
  return res;
}

async function boot() {
  try {
    const res = await fetch("/api/me");
    if (res.ok) me = await res.json();
  } catch {}
  render();
  if (me) {
    await loadProjects();
    setInterval(loadProjects, 5000);
  }
}

function render() {
  const userBox = document.getElementById("userBox");
  const app = document.getElementById("app");

  if (!me) {
    userBox.innerHTML = `<button class="primary" onclick="location.href='/auth/login'">Sign in with GitHub</button>`;
    app.innerHTML = `
      <div class="hero">
        <h1>Deploy any repo. Push to ship.</h1>
        <p>Link a GitHub repo and every push gets a live preview URL.<br>Merge to your default branch to go to production.</p>
        <button class="primary" onclick="location.href='/auth/login'">Sign in with GitHub</button>
      </div>`;
    return;
  }

  userBox.innerHTML = `
    <img src="${me.avatarUrl}" alt="" />
    <span>${me.login}</span>
    <button onclick="logout()">Sign out</button>`;

  app.innerHTML = `
    <div class="row">
      <h2>Projects</h2>
      <button class="primary" onclick="openLinkModal()">+ Link repo</button>
    </div>
    <div id="projectList"></div>`;

  renderProjects();
}

function renderProjects() {
  const el = document.getElementById("projectList");
  if (!el) return;
  if (projects.length === 0) {
    el.innerHTML = `<div class="empty">No projects linked yet. Click "Link repo" to deploy your first push.</div>`;
    return;
  }
  el.innerHTML = projects.map(projectCard).join("");
}

function badge(status) {
  const label = status === "success" ? "ready" : status;
  return `<span class="badge ${status}"><span class="pulse"></span>${label}</span>`;
}

function projectCard(p) {
  const deploys = deploymentsByRepo[p.repo] || [];
  const latest = deploys[0];
  const production = deploys.find((d) => d.is_production);
  const isOpen = openStreams["card:" + p.repo];

  return `
    <div class="card project-card">
      <div class="project-head" onclick="toggleProject('${p.repo}')">
        <div>
          <div class="project-repo">${p.repo}</div>
          <div class="project-meta">
            default branch: ${p.defaultBranch}
            ${production ? ` · production: <a class="link" onclick="event.stopPropagation()" href="${production.preview_url}" target="_blank">${production.preview_url}</a>` : ""}
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          ${latest ? badge(latest.status) : ""}
          <button class="danger" onclick="event.stopPropagation(); unlink('${p.repo}')">Unlink</button>
        </div>
      </div>
      <div class="deploy-list ${isOpen ? "open" : ""}" id="deploys-${cssId(p.repo)}">
        ${deploys.length ? deploys.map(deployRow).join("") : `<div class="hint">No deployments yet — push to ${p.repo} to trigger one.</div>`}
      </div>
    </div>`;
}

function deployRow(d) {
  return `
    <div class="deploy-row" onclick="event.stopPropagation(); toggleLog(${d.id})">
      <div class="deploy-left">
        ${badge(d.status)}
        <span>${d.branch}</span>
        <span class="sha">${d.sha.slice(0, 7)}</span>
        ${d.is_production ? '<span class="badge success">production</span>' : ""}
      </div>
      ${d.preview_url ? `<a class="link" onclick="event.stopPropagation()" href="${d.preview_url}" target="_blank">${d.preview_url.replace("https://", "")}</a>` : `<span class="hint">building...</span>`}
    </div>
    <div id="log-${d.id}" style="display:none;"></div>`;
}

function cssId(repo) { return repo.replace(/[^a-zA-Z0-9]/g, "-"); }

function toggleProject(repo) {
  const key = "card:" + repo;
  openStreams[key] = !openStreams[key];
  renderProjects();
}

async function toggleLog(id) {
  const container = document.getElementById(`log-${id}`);
  if (!container) return;
  const isOpen = container.style.display !== "none";
  if (isOpen) {
    container.style.display = "none";
    return;
  }
  container.style.display = "block";
  container.innerHTML = `<pre class="log" id="pre-${id}">connecting...</pre>`;
  const pre = document.getElementById(`pre-${id}`);
  pre.textContent = "";

  const source = new EventSource(`/api/deployments/${id}/stream`);
  source.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    if (payload.chunk) {
      pre.textContent += payload.chunk;
      pre.scrollTop = pre.scrollHeight;
    }
    if (payload.done) source.close();
  };
}

async function loadProjects() {
  const res = await api("/api/projects");
  projects = await res.json();
  await Promise.all(
    projects.map(async (p) => {
      const r = await api(`/api/deployments?repo=${encodeURIComponent(p.repo)}`);
      deploymentsByRepo[p.repo] = await r.json();
    }),
  );
  renderProjects();
}

async function openLinkModal() {
  document.getElementById("linkModal").classList.add("open");
  document.getElementById("repoList").innerHTML = `<div class="hint" style="padding:10px;">Loading your repos...</div>`;
  const res = await api("/api/repos");
  repos = await res.json();
  renderRepoList();
}

function closeLinkModal() {
  document.getElementById("linkModal").classList.remove("open");
}

function renderRepoList() {
  const q = (document.getElementById("repoSearch").value || "").toLowerCase();
  const filtered = repos.filter((r) => r.fullName.toLowerCase().includes(q));
  document.getElementById("repoList").innerHTML = filtered
    .map(
      (r) => `
      <div class="repo-item" onclick="linkRepo('${r.fullName}')">
        <span class="name">${r.fullName}</span>
        ${r.private ? '<span class="hint">private</span>' : ""}
      </div>`,
    )
    .join("") || `<div class="hint" style="padding:10px;">No matching repos.</div>`;
}

async function linkRepo(fullName) {
  document.getElementById("repoList").innerHTML = `<div class="hint" style="padding:10px;">Linking ${fullName}...</div>`;
  const res = await api("/api/projects", { method: "POST", body: JSON.stringify({ repo: fullName }) });
  if (!res.ok) {
    const err = await res.json();
    alert("Failed to link repo: " + err.error);
    return;
  }
  closeLinkModal();
  await loadProjects();
}

async function unlink(repo) {
  if (!confirm(`Unlink ${repo}? This removes its webhook.`)) return;
  const [owner, name] = repo.split("/");
  await api(`/api/projects/${owner}/${name}`, { method: "DELETE" });
  await loadProjects();
}

async function logout() {
  await api("/auth/logout", { method: "POST" });
  me = null;
  projects = [];
  render();
}

boot();
</script>
</body>
</html>
