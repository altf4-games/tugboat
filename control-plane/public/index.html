<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tugboat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --bg-raised: #0a0a0a;
    --bg-hover: #111111;
    --border: #1f1f1f;
    --border-hover: #333333;
    --text: #fafafa;
    --text-dim: #888888;
    --text-faint: #666666;
    --blue: #0070f3;
    --green: #17c964;
    --red: #f5222d;
    --amber: #f5a623;
    --radius: 8px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--text);
    padding: 8px 16px;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: var(--border-hover); background: var(--bg-hover); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
  button.primary:hover { opacity: .85; background: var(--text); }
  button.ghost { background: transparent; border-color: transparent; }
  button.ghost:hover { background: var(--bg-hover); border-color: var(--border); }
  button.danger { color: var(--red); }
  input[type=text] {
    font: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    width: 100%;
  }
  input[type=text]:focus { outline: none; border-color: var(--text-dim); }
  .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top nav ---------- */
  nav.topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 64px;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; cursor: pointer; letter-spacing: -0.01em; }
  .logo-mark { display: block; }
  .nav-user { display: flex; align-items: center; gap: 12px; }
  .nav-user img { width: 26px; height: 26px; border-radius: 50%; }
  .nav-user-name { font-size: 13px; color: var(--text-dim); }

  /* ---------- landing ---------- */
  .landing-hero {
    text-align: center;
    padding: 130px 24px 56px;
    max-width: 720px;
    margin: 0 auto;
  }
  .landing-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 12px;
    margin-bottom: 24px;
  }
  .landing-hero h1 {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin: 0 0 20px;
    background: linear-gradient(180deg, #fff 0%, #999 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .landing-hero p {
    font-size: 18px;
    color: var(--text-dim);
    margin: 0 0 36px;
    line-height: 1.5;
  }
  @media (max-width: 600px) {
    .landing-hero { padding: 90px 20px 44px; }
    .landing-hero h1 { font-size: 36px; }
    .landing-hero p { font-size: 16px; margin-bottom: 28px; }
    .features { margin-top: 90px; }
  }
  .cta-row { display: flex; gap: 12px; justify-content: center; }
  .cta-row button { padding: 12px 22px; font-size: 15px; border-radius: 8px; }
  .gh-icon { width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px; }

  /* ---------- product mockup ---------- */
  .mockup-wrap { max-width: 680px; margin: 8px auto 0; padding: 0 24px; }
  .terminal {
    background: #0c0c0c;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 60px 120px -40px rgba(0,0,0,.7);
  }
  .terminal-bar { display: flex; align-items: center; gap: 7px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .terminal-dot { width: 11px; height: 11px; border-radius: 50%; }
  .terminal-dot.red { background: #ff5f56; }
  .terminal-dot.yellow { background: #ffbd2e; }
  .terminal-dot.green { background: #27c93f; }
  .terminal-body { padding: 24px 26px 28px; font-family: var(--font-mono); font-size: 13px; line-height: 2; text-align: left; }
  .t-prompt { color: #666; }
  .t-cmd { color: var(--text); }
  .t-out { color: var(--text-faint); }
  .t-ok { color: var(--green); }
  .t-tag { color: var(--text-faint); }
  .t-url { color: var(--blue); }
  .t-cursor { display: inline-block; width: 7px; height: 14px; background: var(--text-dim); margin-left: 3px; vertical-align: -2px; animation: t-blink 1s step-end infinite; }
  @keyframes t-blink { 50% { opacity: 0; } }

  /* ---------- feature list ---------- */
  .features { max-width: 880px; margin: 150px auto 0; padding: 0 24px 130px; }
  .features-head { text-align: center; margin-bottom: 60px; }
  .features-eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin-bottom: 12px; }
  .features-head h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .feature-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 52px 64px; }
  @media (max-width: 700px) { .feature-grid { grid-template-columns: 1fr; gap: 40px; } }
  .feature { border-top: 1px solid var(--border); padding-top: 22px; }
  .feature .f-index { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); display: block; margin-bottom: 16px; }
  .feature h3 { font-size: 17px; margin: 0 0 9px; font-weight: 600; letter-spacing: -0.01em; }
  .feature p { font-size: 14px; color: var(--text-dim); margin: 0; line-height: 1.65; max-width: 36ch; }

  .landing-footer {
    text-align: center;
    padding: 24px;
    color: var(--text-faint);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  /* ---------- dashboard ---------- */
  main.dashboard { padding: 40px 0 80px; }
  .page-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .page-row h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 700px) { .project-grid { grid-template-columns: 1fr; } }

  .project-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .project-card:hover { border-color: var(--border-hover); }
  .pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .pc-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .pc-avatar { width: 20px; height: 20px; border-radius: 5px; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 11px; flex: 0 0 auto; }
  .pc-meta { color: var(--text-dim); font-size: 12px; margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pc-url { color: var(--blue); text-decoration: none; font-size: 12px; }
  .pc-url:hover { text-decoration: underline; }
  .pc-updated { margin-top: 14px; font-size: 12px; color: var(--text-faint); }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .status-dot.success { background: var(--green); }
  .status-dot.failed { background: var(--red); }
  .status-dot.building { background: var(--amber); animation: blink 1.1s infinite; }
  .status-dot.torn_down { background: var(--text-faint); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 100px;
  }
  .badge.success { background: rgba(23,201,100,.12); color: var(--green); }
  .badge.failed { background: rgba(245,34,45,.12); color: var(--red); }
  .badge.building { background: rgba(245,166,35,.12); color: var(--amber); }
  .badge.torn_down { background: rgba(255,255,255,.06); color: var(--text-faint); }

  /* ---------- preview thumbnails ---------- */
  .pc-thumb {
    width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
    background: var(--bg-hover); border: 1px solid var(--border);
    margin-bottom: 14px; display: flex; align-items: center; justify-content: center;
  }
  .pc-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pc-thumb .thumb-placeholder { color: var(--text-faint); font-size: 11px; text-decoration: none; }
  a:has(.pc-thumb) { text-decoration: none; }
  .dr-thumb {
    width: 88px; flex: 0 0 auto; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden;
    background: var(--bg-hover); border: 1px solid var(--border);
  }
  .dr-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  @media (max-width: 700px) { .dr-thumb { display: none; } }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty-state h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; }

  /* ---------- project detail ---------- */
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; margin-bottom: 18px; cursor: pointer; background: none; border: none; padding: 0; }
  .back-link:hover { color: var(--text); }
  .pd-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .pd-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .pd-sub { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .pd-actions { display: flex; gap: 8px; }

  .panel { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }

  .deploy-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .deploy-row:last-child { border-bottom: none; }
  .deploy-row:hover { background: var(--bg-hover); }
  .dr-main { flex: 1; min-width: 0; }
  .dr-branch { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
  .dr-meta { color: var(--text-dim); font-size: 12px; margin-top: 3px; font-family: var(--font-mono); }
  .dr-time { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
  .dr-url { color: var(--blue); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .dr-url:hover { text-decoration: underline; }
  .prod-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #000; background: var(--text); padding: 2px 6px; border-radius: 4px; }
  .dr-delete { background: none; border: none; padding: 4px 6px; font-size: 13px; color: var(--text-faint); opacity: .6; }
  .dr-delete:hover { color: var(--red); opacity: 1; background: rgba(245,34,45,.1); border: none; }

  .log-panel { border-top: 1px solid var(--border); }
  pre.log {
    background: #000;
    color: #ccc;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 16px 18px;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; gap: 16px; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-row.stacked { flex-direction: column; align-items: stretch; }
  .settings-label { font-size: 13px; }
  .settings-label .hint-sm { display: block; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .settings-row .field { display: flex; gap: 8px; align-items: center; width: 320px; max-width: 50%; }
  .settings-row.stacked .field { width: 100%; max-width: none; }

  .env-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .env-row input[type=text] { font-family: var(--font-mono); font-size: 12px; }
  .env-row .env-key { flex: 0 0 34%; }
  .env-row .env-val { flex: 1; }
  .env-row .env-del { flex: 0 0 auto; padding: 8px 10px; color: var(--text-faint); }
  .env-row .env-del:hover { color: var(--red); }
  .limits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .limits-grid label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }

  .wh-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .wh-table th { text-align: left; color: var(--text-faint); font-weight: 500; padding: 6px 18px; text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }
  .wh-table td { padding: 8px 18px; border-top: 1px solid var(--border); font-family: var(--font-mono); }
  .wh-status { font-family: var(--font); font-weight: 600; }
  .wh-status.ok { color: var(--green); }
  .wh-status.error, .wh-status.invalid_signature { color: var(--red); }
  .wh-status.ignored { color: var(--text-faint); }

  /* ---------- modal ---------- */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 480px;
    max-width: 90vw;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .close-x { background: none; border: none; color: var(--text-dim); font-size: 18px; padding: 0; }
  .modal input[type=text] { margin: 14px 18px 0; width: calc(100% - 36px); }
  .repo-list { overflow-y: auto; padding: 8px 8px 14px; }
  .repo-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 6px; cursor: pointer; }
  .repo-item:hover { background: var(--bg-hover); }
  .repo-item .name { font-family: var(--font-mono); font-size: 13px; }
  .hint { color: var(--text-dim); font-size: 12px; margin: 0 0 6px; }
  .modal-body { padding: 4px 18px 18px; }

  .spinner-page { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text-faint); font-size: 13px; }
</style>
</head>
<body>

<div id="root"></div>

<div class="modal-backdrop" id="linkModal">
  <div class="modal">
    <div class="modal-head">
      <span>Link a GitHub repo</span>
      <button class="close-x" onclick="closeLinkModal()">✕</button>
    </div>
    <input type="text" id="repoSearch" placeholder="Search your repos..." oninput="renderRepoList()" />
    <div class="repo-list" id="repoList"></div>
  </div>
</div>

<script>
const ICON_GH = `<svg class="gh-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>`;

let me = null;
let booted = false;
let view = "dashboard"; // 'dashboard' | 'project'
let currentRepo = null;
let projects = [];
let deploymentsByRepo = {};
let repos = [];
let selectedRepo = null;
let openDeployId = null;
let rootDirDraft = "";
let envVarsDraft = []; // [{key, value}] — draft state so typing survives the 4s poll re-render
let limitsDraft = { memoryLimit: "", cpuLimit: "" };
let webhookDeliveries = [];

async function api(path, opts) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(opts && opts.headers) } });
  if (res.status === 401) { me = null; render(); throw new Error("not signed in"); }
  return res;
}

function escapeAttr(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function thumbErrorHandler(el) {
  el.parentElement.innerHTML = '<span class="thumb-placeholder">No preview yet</span>';
  el.parentElement.classList.add("empty");
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 5) return "just now";
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

async function boot() {
  try {
    const res = await fetch("/api/me");
    if (res.ok) me = await res.json();
  } catch {}
  booted = true;
  render();
  if (me) {
    await loadProjects();
    setInterval(loadProjects, 4000);
  }
}

function render() {
  const root = document.getElementById("root");
  if (!booted) {
    root.innerHTML = `<div class="spinner-page">Loading…</div>`;
    return;
  }
  if (!me) {
    root.innerHTML = renderLanding();
    return;
  }
  root.innerHTML = renderNav() + (view === "project" ? renderProjectDetail() : renderDashboard());
}

/* ---------------- landing ---------------- */

function renderLanding() {
  return `
    <nav class="topnav">
      <div class="logo"><svg class="logo-mark" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M1 15 L23 15 L19 21 L5 21 Z" fill="currentColor"/><rect x="5" y="8" width="11" height="7" rx="0.9" fill="currentColor"/><rect x="8.8" y="8.8" width="1.5" height="5.4" fill="var(--bg)"/><rect x="12.2" y="8.8" width="1.5" height="5.4" fill="var(--bg)"/><rect x="15.3" y="3.6" width="2.6" height="5.6" rx="0.7" fill="currentColor"/></svg> Tugboat</div>
      <button class="primary" onclick="location.href='/auth/login'">${ICON_GH}Sign in with GitHub</button>
    </nav>
    <div class="landing-hero">
      <div class="landing-badge">● self-hosted, runs on your machine</div>
      <h1>Deploy any repo.<br>Push to ship.</h1>
      <p>Link a GitHub repo and every push gets a live preview URL.
      Merge to your default branch and it goes to production — zero
      downtime, automatically.</p>
      <div class="cta-row">
        <button class="primary" onclick="location.href='/auth/login'">${ICON_GH}Sign in with GitHub</button>
      </div>
    </div>

    <div class="mockup-wrap">
      <div class="terminal">
        <div class="terminal-bar">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
        </div>
        <div class="terminal-body">
          <div><span class="t-prompt">$</span> <span class="t-cmd">git push origin main</span></div>
          <div class="t-out">Enumerating objects, done.</div>
          <div class="t-out">To github.com:you/your-app.git</div>
          <div>&nbsp;</div>
          <div class="t-ok">✓ Build complete <span class="t-tag">(paketobuildpacks · 18s)</span></div>
          <div class="t-ok">✓ Routed <span class="t-tag">via Traefik, zero config</span></div>
          <div class="t-ok">✓ Promoted to production <span class="t-tag">(0 dropped requests)</span></div>
          <div>&nbsp;</div>
          <div>Production: <a class="t-url" href="#">https://your-app.127.0.0.1.nip.io</a><span class="t-cursor"></span></div>
        </div>
      </div>
    </div>

    <div class="features">
      <div class="features-head">
        <div class="features-eyebrow">How it works</div>
        <h2>Push. Tugboat does the rest.</h2>
      </div>
      <div class="feature-grid">
        <div class="feature">
          <span class="f-index">01</span>
          <h3>Instant previews</h3>
          <p>Every branch push gets a real, public URL within seconds — no config, no manual deploy step.</p>
        </div>
        <div class="feature">
          <span class="f-index">02</span>
          <h3>Zero-downtime promotes</h3>
          <p>Merging to your default branch blue-green swaps production, verified with zero dropped requests.</p>
        </div>
        <div class="feature">
          <span class="f-index">03</span>
          <h3>Live build logs</h3>
          <p>Watch pack build stream in real time as it happens — not just a spinner, then a result.</p>
        </div>
        <div class="feature">
          <span class="f-index">04</span>
          <h3>One-click rollback</h3>
          <p>Something broke? Redeploy the previous image from real deployment history, in one call.</p>
        </div>
      </div>
    </div>

    <div class="landing-footer">Tugboat — a self-hosted PaaS built on Buildpacks, Docker, Traefik &amp; Cloudflare Tunnel.</div>
  `;
}

/* ---------------- nav ---------------- */

function renderNav() {
  return `
    <nav class="topnav">
      <div class="logo" onclick="goHome()"><svg class="logo-mark" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M1 15 L23 15 L19 21 L5 21 Z" fill="currentColor"/><rect x="5" y="8" width="11" height="7" rx="0.9" fill="currentColor"/><rect x="8.8" y="8.8" width="1.5" height="5.4" fill="var(--bg)"/><rect x="12.2" y="8.8" width="1.5" height="5.4" fill="var(--bg)"/><rect x="15.3" y="3.6" width="2.6" height="5.6" rx="0.7" fill="currentColor"/></svg> Tugboat</div>
      <div class="nav-user">
        <span class="nav-user-name">${me.login}</span>
        <img src="${me.avatarUrl}" alt="" />
        <button class="ghost" onclick="logout()">Sign out</button>
      </div>
    </nav>`;
}

function goHome() {
  view = "dashboard";
  currentRepo = null;
  render();
}

/* ---------------- dashboard ---------------- */

function renderDashboard() {
  return `
    <main class="dashboard">
      <div class="container">
        <div class="page-row">
          <h1>Projects</h1>
          <button class="primary" onclick="openLinkModal()">+ New Project</button>
        </div>
        ${projects.length === 0 ? renderEmptyState() : `<div class="project-grid">${projects.map(projectCard).join("")}</div>`}
      </div>
    </main>`;
}

function renderEmptyState() {
  return `
    <div class="empty-state">
      <h2>No projects yet</h2>
      <p>Link a GitHub repo to deploy your first push.</p>
      <div style="margin-top:20px;"><button class="primary" onclick="openLinkModal()">+ New Project</button></div>
    </div>`;
}

function projectCard(p) {
  const deploys = deploymentsByRepo[p.repo] || [];
  const latest = deploys[0];
  const production = deploys.find((d) => d.is_production);
  const thumbDeploy = production || latest;
  const initial = p.repo.split("/")[1]?.[0]?.toUpperCase() || "?";

  return `
    <div class="project-card" onclick="openProject('${p.repo}')">
      <div class="pc-thumb">
        ${thumbDeploy ? `<img src="/api/deployments/${thumbDeploy.id}/screenshot" alt="" onerror="thumbErrorHandler(this)" />` : `<span class="thumb-placeholder">No deployments yet</span>`}
      </div>
      <div class="pc-top">
        <div class="pc-name"><span class="pc-avatar">${initial}</span>${p.repo}</div>
        ${latest ? `<span class="status-dot ${latest.status}"></span>` : ""}
      </div>
      <div class="pc-meta">
        <span>${p.defaultBranch}</span>
        ${p.rootDirectory ? `<span>· ${p.rootDirectory}</span>` : ""}
        ${production ? `<span>· <a class="pc-url" onclick="event.stopPropagation()" href="${production.preview_url}" target="_blank">${production.preview_url.replace("https://", "")}</a></span>` : ""}
      </div>
      <div class="pc-updated">${latest ? `Deployed ${timeAgo(latest.created_at)}` : "No deployments yet"}</div>
    </div>`;
}

/* ---------------- project detail ---------------- */

function openProject(repo) {
  currentRepo = repo;
  view = "project";
  openDeployId = null;
  const p = projects.find((x) => x.repo === repo);
  rootDirDraft = p ? p.rootDirectory || "" : "";
  envVarsDraft = p ? Object.entries(p.envVars || {}).map(([key, value]) => ({ key, value })) : [];
  limitsDraft = { memoryLimit: (p && p.memoryLimit) || "", cpuLimit: (p && p.cpuLimit) || "" };
  webhookDeliveries = [];
  render();
  loadWebhookDeliveries(repo);
}

function renderProjectDetail() {
  const p = projects.find((x) => x.repo === currentRepo);
  if (!p) return `<main class="dashboard"><div class="container">Project not found.</div></main>`;
  const deploys = deploymentsByRepo[p.repo] || [];
  const production = deploys.find((d) => d.is_production);

  return `
    <main class="dashboard">
      <div class="container">
        <button class="back-link" onclick="goHome()">← All projects</button>
        <div class="pd-header">
          <div>
            <div class="pd-title">${p.repo}</div>
            <div class="pd-sub">default branch: ${p.defaultBranch}${p.rootDirectory ? ` · root: ${p.rootDirectory}` : ""}</div>
          </div>
          <div class="pd-actions">
            ${production ? `<button onclick="rollbackProject('${p.repo}')">↩ Rollback</button>` : ""}
            <button onclick="deployNow('${p.repo}', '${p.defaultBranch}')">⟳ Redeploy ${p.defaultBranch}</button>
          </div>
        </div>

        ${production && production.preview_url ? `
        <div class="panel">
          <a href="${production.preview_url}" target="_blank" style="display:block;">
            <div class="pc-thumb" style="margin:0; border-radius:0; aspect-ratio:21/8;">
              <img src="/api/deployments/${production.id}/screenshot" alt="" onerror="thumbErrorHandler(this)" />
            </div>
          </a>
        </div>` : ""}

        <div class="panel">
          <div class="panel-head">Deployments</div>
          ${deploys.length ? deploys.map((d) => deployRow(d)).join("") : `<div style="padding:20px 18px;" class="hint">No deployments yet — push to ${p.repo}, or click Redeploy above.</div>`}
        </div>

        <div class="panel">
          <div class="panel-head">Settings</div>
          <div class="settings-row">
            <div class="settings-label">
              Root directory
              <span class="hint-sm">Where the app to build lives in this repo (blank = repo root).</span>
            </div>
            <div class="field">
              <input type="text" id="rootDirSetting" value="${escapeAttr(rootDirDraft)}" oninput="rootDirDraft = this.value" placeholder="e.g. sample-app" />
              <button onclick="saveRootDirectory('${p.repo}')">Save</button>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-label">
              Unlink project
              <span class="hint-sm">Removes the GitHub webhook and permanently deletes this project's deployments, containers, images, and build cache.</span>
            </div>
            <button class="danger" onclick="unlink('${p.repo}')">Unlink</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            Environment Variables
            <button class="ghost" onclick="addEnvRow()" style="padding:4px 10px; font-size:12px;">+ Add</button>
          </div>
          <div class="settings-row stacked">
            <div class="field" style="display:block;">
              ${envVarRows()}
            </div>
            <div>
              <button class="primary" onclick="saveEnvVars('${p.repo}')">Save environment variables</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">Resource Limits</div>
          <div class="settings-row stacked">
            <div class="settings-label hint-sm" style="margin-bottom:2px;">Applied to this project's containers via <code>docker run --memory / --cpus</code>. Leave blank for unlimited.</div>
            <div class="field">
              ${renderLimitsFields()}
            </div>
            <div>
              <button class="primary" onclick="saveResourceLimits('${p.repo}')">Save resource limits</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">Recent Webhook Deliveries</div>
          ${webhookDeliveriesPanel()}
        </div>
      </div>
    </main>`;
}

function envVarRows() {
  if (envVarsDraft.length === 0) {
    return `<div class="hint" style="margin:0 0 10px;">No environment variables set.</div>`;
  }
  return envVarsDraft
    .map(
      (row, i) => `
    <div class="env-row">
      <input type="text" class="env-key" value="${escapeAttr(row.key)}" placeholder="KEY" oninput="envVarsDraft[${i}].key = this.value" />
      <input type="text" class="env-val" value="${escapeAttr(row.value)}" placeholder="value" oninput="envVarsDraft[${i}].value = this.value" />
      <button class="env-del" title="Remove" onclick="removeEnvRow(${i})">✕</button>
    </div>`,
    )
    .join("");
}

function addEnvRow() {
  envVarsDraft.push({ key: "", value: "" });
  render();
}

function removeEnvRow(i) {
  envVarsDraft.splice(i, 1);
  render();
}

async function saveEnvVars(repo) {
  const envVars = {};
  for (const row of envVarsDraft) {
    if (row.key.trim()) envVars[row.key.trim()] = row.value;
  }
  const res = await api(`/api/projects/${repo}`, { method: "PATCH", body: JSON.stringify({ envVars }) });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || "Failed to save environment variables.");
    return;
  }
  await loadProjects();
}

function renderLimitsFields() {
  return `
    <div class="limits-grid">
      <div>
        <label>Memory limit</label>
        <input type="text" value="${escapeAttr(limitsDraft.memoryLimit)}" placeholder="e.g. 512m (unlimited)" oninput="limitsDraft.memoryLimit = this.value" />
      </div>
      <div>
        <label>CPU limit</label>
        <input type="text" value="${escapeAttr(limitsDraft.cpuLimit)}" placeholder="e.g. 1.0 (unlimited)" oninput="limitsDraft.cpuLimit = this.value" />
      </div>
    </div>`;
}

async function saveResourceLimits(repo) {
  const res = await api(`/api/projects/${repo}`, {
    method: "PATCH",
    body: JSON.stringify({ memoryLimit: limitsDraft.memoryLimit, cpuLimit: limitsDraft.cpuLimit }),
  });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || "Failed to save resource limits.");
    return;
  }
  await loadProjects();
}

async function loadWebhookDeliveries(repo) {
  const [owner, name] = repo.split("/");
  const res = await api(`/api/projects/${owner}/${name}/webhook-deliveries`);
  if (!res.ok) return;
  webhookDeliveries = await res.json();
  if (view === "project" && currentRepo === repo) render();
}

function webhookDeliveriesPanel() {
  if (webhookDeliveries.length === 0) {
    return `<div style="padding:20px 18px;" class="hint">No webhook deliveries yet — they'll show up here as GitHub sends real pushes and branch deletes.</div>`;
  }
  return `
    <div style="overflow-x:auto;">
      <table class="wh-table">
        <thead><tr><th>Time</th><th>Event</th><th>Status</th><th>Detail</th></tr></thead>
        <tbody>
          ${webhookDeliveries
            .map(
              (d) => `
          <tr>
            <td>${timeAgo(d.received_at)}</td>
            <td>${d.event}</td>
            <td class="wh-status ${d.status}">${d.status.replace(/_/g, " ")}</td>
            <td>${d.detail || ""}</td>
          </tr>`,
            )
            .join("")}
        </tbody>
      </table>
    </div>`;
}

async function rollbackProject(repo) {
  if (!confirm(`Roll back production for ${repo} to the previously-promoted deployment? This re-points the live production route right away.`)) return;
  const [owner, name] = repo.split("/");
  const res = await api(`/api/projects/${owner}/${name}/rollback`, { method: "POST" });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || "Rollback failed.");
    return;
  }
  await loadProjects();
}

function deployRow(d) {
  const isOpen = openDeployId === d.id;
  const tornDown = d.status === "torn_down";
  return `
    <div>
      <div class="deploy-row" onclick="toggleLog(${d.id})">
        <span class="status-dot ${d.status}"></span>
        <div class="dr-thumb"><img src="/api/deployments/${d.id}/screenshot" alt="" onerror="this.parentElement.style.display='none'" /></div>
        <div class="dr-main">
          <div class="dr-branch">${d.branch} ${d.is_production ? '<span class="prod-tag">Production</span>' : ""}</div>
          <div class="dr-meta">${d.sha.slice(0, 7)}</div>
        </div>
        <div class="dr-time">${timeAgo(d.created_at)}</div>
        ${d.preview_url && !tornDown ? `<a class="dr-url" onclick="event.stopPropagation()" href="${d.preview_url}" target="_blank">Visit ↗</a>` : `<span class="badge ${d.status}">${tornDown ? "torn down" : d.status}</span>`}
        ${d.is_production ? "" : `<button class="dr-delete" title="Delete deployment" onclick="event.stopPropagation(); deleteDeployment(${d.id})">🗑</button>`}
      </div>
      ${isOpen ? `<div class="log-panel"><pre class="log" id="pre-${d.id}">connecting…</pre></div>` : ""}
    </div>`;
}

async function deleteDeployment(id) {
  if (!confirm("Delete this deployment? This also stops its preview container and tunnel if still running.")) return;
  const res = await api(`/api/deployments/${id}`, { method: "DELETE" });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || "Failed to delete deployment.");
    return;
  }
  await loadProjects();
}

function toggleLog(id) {
  openDeployId = openDeployId === id ? null : id;
  render();
  if (openDeployId === id) streamLog(id);
}

function streamLog(id) {
  const pre = document.getElementById(`pre-${id}`);
  if (!pre) return;
  pre.textContent = "";
  const source = new EventSource(`/api/deployments/${id}/stream`);
  source.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    if (payload.chunk) {
      pre.textContent += payload.chunk;
      pre.scrollTop = pre.scrollHeight;
    }
    if (payload.done) source.close();
  };
}

async function deployNow(repo, branch) {
  try {
    const res = await api(`/api/projects/${repo}/deploy`, {
      method: "POST",
      body: JSON.stringify({ branch }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || "Failed to deploy.");
      return;
    }
    await loadProjects();
  } catch (err) {
    alert("Failed to deploy: " + err.message);
  }
}

async function saveRootDirectory(repo) {
  const value = document.getElementById("rootDirSetting").value;
  const res = await api(`/api/projects/${repo}`, { method: "PATCH", body: JSON.stringify({ rootDirectory: value }) });
  if (res.ok) await loadProjects();
}

/* ---------------- data loading ---------------- */

async function loadProjects() {
  const res = await api("/api/projects");
  projects = await res.json();
  await Promise.all(
    projects.map(async (p) => {
      const r = await api(`/api/deployments?repo=${encodeURIComponent(p.repo)}`);
      deploymentsByRepo[p.repo] = await r.json();
    }),
  );
  // While a log panel is open, its <pre> is being written into by a live
  // EventSource. A full re-render replaces that DOM node with a fresh
  // "connecting…" placeholder and orphans the stream (it keeps writing
  // into the now-detached old node), which is why logs used to appear to
  // freeze on "connecting…" a few seconds in — this poll runs every 4s.
  // Keep the underlying data fresh, but skip the DOM rebuild while a log
  // is open; it'll reflect the latest data as soon as the panel closes.
  if (!(view === "project" && openDeployId !== null)) {
    render();
  }
}

/* ---------------- link modal ---------------- */

async function openLinkModal() {
  selectedRepo = null;
  document.getElementById("linkModal").classList.add("open");
  document.getElementById("repoSearch").style.display = "block";
  document.getElementById("repoList").innerHTML = `<div class="hint" style="padding:10px;">Loading your repos…</div>`;
  const res = await api("/api/repos");
  repos = await res.json();
  renderRepoList();
}

function closeLinkModal() {
  document.getElementById("linkModal").classList.remove("open");
  selectedRepo = null;
}

function renderRepoList() {
  if (selectedRepo) return renderLinkConfirm();
  document.getElementById("repoSearch").style.display = "block";
  const q = (document.getElementById("repoSearch").value || "").toLowerCase();
  const filtered = repos.filter((r) => r.fullName.toLowerCase().includes(q));
  document.getElementById("repoList").innerHTML = filtered
    .map(
      (r) => `
      <div class="repo-item" onclick="selectRepo('${r.fullName}')">
        <span class="name">${r.fullName}</span>
        ${r.private ? '<span class="hint" style="margin:0;">private</span>' : ""}
      </div>`,
    )
    .join("") || `<div class="hint" style="padding:10px;">No matching repos.</div>`;
}

function selectRepo(fullName) {
  selectedRepo = fullName;
  document.getElementById("repoSearch").style.display = "none";
  renderLinkConfirm();
}

function renderLinkConfirm() {
  document.getElementById("repoList").innerHTML = `
    <div class="modal-body">
      <div style="font-weight:600; margin-bottom:4px;">${selectedRepo}</div>
      <p class="hint">
        Root directory (optional) — where the app to build actually lives in
        this repo. Leave blank if it's at the repo root.
      </p>
      <input type="text" id="rootDirInput" placeholder="e.g. sample-app" style="margin:0 0 12px;" />
      <div style="display:flex; gap:8px;">
        <button class="primary" onclick="confirmLink()">Link repo</button>
        <button onclick="selectedRepo=null; renderRepoList();">Back</button>
      </div>
    </div>`;
}

async function confirmLink() {
  const rootDirectory = document.getElementById("rootDirInput").value.trim();
  document.getElementById("repoList").innerHTML = `<div class="hint" style="padding:10px;">Linking ${selectedRepo}…</div>`;
  const res = await api("/api/projects", { method: "POST", body: JSON.stringify({ repo: selectedRepo, rootDirectory }) });
  if (!res.ok) {
    const err = await res.json();
    alert("Failed to link repo: " + err.error);
    selectedRepo = null;
    renderRepoList();
    return;
  }
  closeLinkModal();
  await loadProjects();
}

async function unlink(repo) {
  if (!confirm(`Unlink ${repo}? This removes its webhook and permanently deletes its deployment history, running containers, built images, and build cache.`)) return;
  const [owner, name] = repo.split("/");
  await api(`/api/projects/${owner}/${name}`, { method: "DELETE" });
  goHome();
  await loadProjects();
}

async function logout() {
  await api("/auth/logout", { method: "POST" });
  me = null;
  projects = [];
  render();
}

boot();
</script>
</body>
</html>
